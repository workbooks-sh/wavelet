<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:#0b1020;color:#fff;
            font-family:'Geist',-apple-system,system-ui,sans-serif}
  .bar{height:44px;background:#11182f;display:flex;align-items:center;
       padding:0 18px;color:#9aa4c0;font-size:14px;font-family:monospace}
  .dot{width:11px;height:11px;border-radius:50%;background:#3fe081;margin-right:8px}
  .empty{display:flex;align-items:center;justify-content:center;height:calc(100% - 44px);
         flex-direction:column;color:#5a648a}
  .empty h1{font-size:40px;color:#cdd5ee;margin:0 0 8px}
  .empty p{font-size:18px;margin:0}
</style></head><body>
  <div class="bar"><span class="dot"></span>untitled.workbook — empty</div>
  <div class="empty"><h1>A fresh workbook</h1><p>nothing here yet</p></div>
</body></html>
