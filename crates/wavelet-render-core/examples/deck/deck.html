<!doctype html>
<html>
  <head>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
      section { position: absolute; inset: 0; }
      h1 { margin: 0; font-family: sans-serif; font-weight: 800; color: #fff; }
      .title h1 { font-size: 110px; position: absolute; left: 80px; top: 280px; letter-spacing: -0.03em; }
      .title { background: #0b1020; }
      .title p { position: absolute; left: 84px; top: 430px; font-size: 36px; color: #3fe081; font-family: sans-serif; margin: 0; }
      .green { background: linear-gradient(135deg, #149157, #3fe081); }
      .green h1 { font-size: 86px; position: absolute; left: 80px; top: 120px; }
      .green ul { position: absolute; left: 96px; top: 280px; color: #02160d; font-size: 40px; font-family: sans-serif; line-height: 1.6; }
      .mark { background: #0b1020; }
      .mark img { position: absolute; left: 50%; top: 50%; width: 360px; height: 360px; transform: translate(-50%, -50%); }
      .mark h1 { position: absolute; left: 0; right: 0; bottom: 90px; text-align: center; font-size: 48px; }
    </style>
  </head>
  <body>
    <section class="title">
      <h1>Wavelet Decks</h1>
      <p>one slide per scene, assembled in the nexus</p>
    </section>
    <section class="green">
      <h1>What ships</h1>
      <ul>
        <li>render each scene to a PNG</li>
        <li>assemble a valid OOXML .pptx</li>
        <li>pure-Rust, in the WASM sandbox</li>
      </ul>
    </section>
    <section class="mark">
      <img src="assets/petal.png" />
      <h1>built by render-core</h1>
    </section>
  </body>
</html>
